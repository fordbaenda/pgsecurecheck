[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pgsecurecheck"
version = "0.1.0"
description = "Read-only security posture assessment for PostgreSQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "pgSecureCheck contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
  "Topic :: Security",
]
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "rich>=13.7,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]
release = ["pyinstaller>=6.10,<7"]

[project.scripts]
pgsecurecheck = "pgsecurecheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pgsecurecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL test instance"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pgsecurecheck"]
