name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pgsecurecheck_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lab-only-password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgsecurecheck_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGSECURECHECK_TEST_DSN: postgresql://postgres@localhost:55432/pgsecurecheck_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Prepare intentionally insecure lab
        env:
          PGPASSWORD: lab-only-password
        run: |
          psql "$PGSECURECHECK_TEST_DSN" -f tests/lab/init.sql
          psql "$PGSECURECHECK_TEST_DSN" -c "ALTER SYSTEM SET password_encryption = 'md5'"
          psql "$PGSECURECHECK_TEST_DSN" -c "ALTER SYSTEM SET log_min_error_statement = 'fatal'"
          psql "$PGSECURECHECK_TEST_DSN" -c "ALTER SYSTEM SET debug_print_plan = 'on'"
          psql "$PGSECURECHECK_TEST_DSN" -c "SELECT pg_reload_conf()"
      - run: pytest -m integration
